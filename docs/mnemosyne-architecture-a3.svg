<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1587 1123" role="img" aria-labelledby="title desc">
  <title id="title">MNEMOSYNE implemented architecture</title>
  <desc id="desc">A3 landscape architecture board showing high, mid, and low level implemented components of MNEMOSYNE.</desc>
  <style>
    :root {
      --paper: #f5f1e8;
      --ink: #20242a;
      --muted: #687078;
      --line: #c9c2b6;
      --navy: #17324d;
      --blue: #d9e7ef;
      --coral: #e77b63;
      --coral-soft: #f5d7ce;
      --sage: #d9e4d3;
      --sand: #efe2c4;
      --white: #fffdf8;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Aptos", "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    text { font-family: var(--sans); fill: var(--ink); }
    .mono { font-family: var(--mono); }
    .small { font-size: 13px; letter-spacing: .02em; }
    .label { font-size: 12px; fill: var(--muted); }
    .title { font-size: 39px; font-weight: 700; letter-spacing: -.04em; fill: var(--navy); }
    .subtitle { font-size: 16px; fill: var(--muted); }
    .level { font-size: 14px; font-weight: 700; fill: var(--coral); }
    .section { font-size: 17px; font-weight: 700; fill: var(--navy); }
    .box-title { font-size: 16px; font-weight: 700; fill: var(--navy); }
    .box-copy { font-size: 12px; fill: var(--ink); }
    .tag { font-size: 11px; font-weight: 700; fill: var(--navy); }
    .paper { fill: var(--paper); }
    .panel { fill: var(--white); stroke: var(--line); stroke-width: 1.2; }
    .high { fill: var(--blue); stroke: var(--navy); stroke-width: 1.4; }
    .mid { fill: var(--sage); stroke: #5e7959; stroke-width: 1.3; }
    .data { fill: var(--sand); stroke: #a58b54; stroke-width: 1.3; }
    .risk { fill: var(--coral-soft); stroke: #b75542; stroke-width: 1.3; }
    .optional { fill: #e9e0ef; stroke: #765c85; stroke-width: 1.3; stroke-dasharray: 6 5; }
    .thin { stroke: var(--line); stroke-width: 1; fill: none; }
    .flow { stroke: var(--navy); stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .flow-soft { stroke: #5e7959; stroke-width: 1.6; fill: none; marker-end: url(#arrowSage); }
    .dashed { stroke-dasharray: 7 6; }
    .number { fill: var(--coral); }
    .white { fill: var(--white); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#17324d"/>
    </marker>
    <marker id="arrowSage" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5e7959"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" class="thin" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="1587" height="1123" class="paper"/>
  <rect x="34" y="34" width="1519" height="1055" fill="url(#grid)" opacity=".18"/>
  <rect x="34" y="34" width="1519" height="1055" fill="none" stroke="var(--navy)" stroke-width="2"/>

  <!-- Header -->
  <text x="74" y="88" class="label mono">MNEMOSYNE / IMPLEMENTED ARCHITECTURE / A3 LANDSCAPE</text>
  <text x="74" y="139" class="title">Memory that can explain itself.</text>
  <text x="76" y="169" class="subtitle">Session-scoped entities, hybrid retrieval, auditable lifecycle, and deletion with recovery evidence.</text>
  <rect x="1290" y="70" width="205" height="80" rx="4" class="panel"/>
  <text x="1310" y="96" class="label">IMPLEMENTATION STATUS</text>
  <text x="1310" y="126" class="box-title">implemented core</text>
  <text x="1310" y="143" class="label">optional LLM paths marked</text>

  <!-- Level dividers -->
  <line x1="74" y1="213" x2="1513" y2="213" class="thin"/>
  <text x="74" y="241" class="level">01 / HIGH LEVEL</text>
  <text x="245" y="241" class="section">The system boundary</text>

  <!-- High-level boxes -->
  <rect x="74" y="265" width="285" height="102" rx="8" class="high"/>
  <text x="98" y="298" class="box-title">Harness layer</text>
  <text x="98" y="322" class="box-copy">AgentA coordinates live memory work.</text>
  <text x="98" y="342" class="box-copy">AgentB imports portable capsules.</text>
  <rect x="98" y="349" width="92" height="20" rx="10" class="white" opacity=".8"/>
  <text x="112" y="363" class="tag">AGENT API</text>

  <rect x="414" y="265" width="285" height="102" rx="8" class="mid"/>
  <text x="438" y="298" class="box-title">Memory core</text>
  <text x="438" y="322" class="box-copy">MemoryNode identity, sessions, context.</text>
  <text x="438" y="342" class="box-copy">Extraction and summaries are injectable.</text>
  <rect x="438" y="349" width="112" height="20" rx="10" class="white" opacity=".8"/>
  <text x="451" y="363" class="tag">ENTITY FIRST</text>

  <rect x="754" y="265" width="285" height="102" rx="8" class="data"/>
  <text x="778" y="298" class="box-title">Memory substrates</text>
  <text x="778" y="322" class="box-copy">Knowledge graph plus FAISS vectors.</text>
  <text x="778" y="342" class="box-copy">Filesystem tiers preserve inspectable memory.</text>
  <rect x="778" y="349" width="105" height="20" rx="10" class="white" opacity=".8"/>
  <text x="791" y="363" class="tag">HYBRID MEMORY</text>

  <rect x="1094" y="265" width="401" height="102" rx="8" class="risk"/>
  <text x="1118" y="298" class="box-title">Accountability and recovery</text>
  <text x="1118" y="322" class="box-copy">ErasureEngine, HashChain, residual risk,</text>
  <text x="1118" y="342" class="box-copy">journaled recovery, and graph healing.</text>
  <rect x="1118" y="349" width="108" height="20" rx="10" class="white" opacity=".8"/>
  <text x="1131" y="363" class="tag">AUDITABLE FLOW</text>

  <path d="M359 316 H414" class="flow"/>
  <path d="M699 316 H754" class="flow"/>
  <path d="M1039 316 H1094" class="flow"/>

  <text x="74" y="407" class="label">One identity crosses every store: the MemoryNode UUID.</text>
  <text x="1290" y="407" class="label mono">shared persistence · capsule handoff</text>

  <!-- Mid level -->
  <line x1="74" y1="438" x2="1513" y2="438" class="thin"/>
  <text x="74" y="466" class="level">02 / MID LEVEL</text>
  <text x="245" y="466" class="section">The working flows</text>

  <!-- Mid process lane -->
  <rect x="74" y="493" width="435" height="242" rx="8" class="panel"/>
  <text x="98" y="526" class="box-title">Write and commit</text>
  <circle cx="105" cy="559" r="13" class="number"/><text x="101" y="564" class="white small">1</text>
  <text x="130" y="564" class="box-copy">remember() creates a MemoryNode</text>
  <circle cx="105" cy="600" r="13" class="number"/><text x="101" y="605" class="white small">2</text>
  <text x="130" y="605" class="box-copy">summaries, contradiction checks</text>
  <circle cx="105" cy="641" r="13" class="number"/><text x="101" y="646" class="white small">3</text>
  <text x="130" y="646" class="box-copy">graph, vector, session, audit writes</text>
  <circle cx="105" cy="682" r="13" class="number"/><text x="101" y="687" class="white small">4</text>
  <text x="130" y="687" class="box-copy">commit writes filesystem tiers and heals</text>
  <path d="M105 574 V585 M105 615 V626 M105 656 V667" class="flow-soft"/>
  <text x="98" y="718" class="label mono">AgentA → stores → commit journal</text>

  <rect x="575" y="493" width="435" height="242" rx="8" class="panel"/>
  <text x="599" y="526" class="box-title">Read and compose context</text>
  <rect x="599" y="552" width="170" height="47" rx="6" class="high"/>
  <text x="617" y="580" class="tag">FAISS VECTOR SEARCH</text>
  <rect x="816" y="552" width="170" height="47" rx="6" class="mid"/>
  <text x="838" y="580" class="tag">GRAPH EXPANSION</text>
  <path d="M769 575 H816" class="flow"/>
  <rect x="707" y="632" width="170" height="47" rx="6" class="data"/>
  <text x="728" y="660" class="tag">TOKEN-BOUNDED CONTEXT</text>
  <path d="M684 599 V615 H792 V632" class="flow-soft"/>
  <path d="M901 599 V615 H792 V632" class="flow-soft"/>
  <text x="599" y="718" class="label">ActiveContext exposes selected entity text to the harness.</text>

  <rect x="1076" y="493" width="419" height="242" rx="8" class="panel"/>
  <text x="1100" y="526" class="box-title">Delete and recover</text>
  <rect x="1100" y="552" width="168" height="47" rx="6" class="risk"/>
  <text x="1124" y="580" class="tag">ERASURE ENGINE</text>
  <rect x="1290" y="552" width="168" height="47" rx="6" class="data"/>
  <text x="1311" y="580" class="tag">ERASURE JOURNAL</text>
  <path d="M1268 575 H1290" class="flow"/>
  <rect x="1195" y="632" width="168" height="47" rx="6" class="mid"/>
  <text x="1216" y="660" class="tag">RECOVERY / VERIFY</text>
  <path d="M1184 599 V615 H1279 V632" class="flow-soft"/>
  <path d="M1374 599 V615 H1279 V632" class="flow-soft"/>
  <text x="1100" y="718" class="label">Graph, vectors, filesystem, blocks, and audit are checked.</text>

  <!-- Low level -->
  <line x1="74" y1="786" x2="1513" y2="786" class="thin"/>
  <text x="74" y="814" class="level">03 / LOW LEVEL</text>
  <text x="245" y="814" class="section">The implemented records and interfaces</text>

  <rect x="74" y="842" width="342" height="192" rx="8" class="high"/>
  <text x="98" y="875" class="box-title">MemoryNode record</text>
  <text x="98" y="902" class="box-copy mono">node_id · session_id · content</text>
  <text x="98" y="923" class="box-copy mono">entity_type · properties · trust_status</text>
  <text x="98" y="944" class="box-copy mono">summary_l0 · summary_l1 · content_l2</text>
  <text x="98" y="965" class="box-copy mono">lifecycle · deletion_state · edges</text>
  <text x="98" y="1005" class="label">One UUID binds all representations.</text>

  <rect x="442" y="842" width="342" height="192" rx="8" class="data"/>
  <text x="466" y="875" class="box-title">Persistent files</text>
  <text x="466" y="902" class="box-copy mono">knowledge_graph.json</text>
  <text x="466" y="923" class="box-copy mono">FAISS index + metadata JSON</text>
  <text x="466" y="944" class="box-copy mono">sessions.json</text>
  <text x="466" y="965" class="box-copy mono">viking_memory/.../entity.json</text>
  <text x="466" y="986" class="box-copy mono">audit_log.json · erasure_journal.json</text>
  <text x="466" y="1005" class="label">Capsules package the same state for handoff.</text>

  <rect x="810" y="842" width="342" height="192" rx="8" class="risk"/>
  <text x="834" y="875" class="box-title">Deletion contract</text>
  <text x="834" y="902" class="box-copy">source removal</text>
  <text x="834" y="923" class="box-copy">derived invalidation</text>
  <text x="834" y="944" class="box-copy">inference block</text>
  <text x="834" y="965" class="box-copy">semantic-risk report</text>
  <text x="834" y="986" class="box-copy">filesystem and vector cleanup</text>
  <text x="834" y="1005" class="label">ErasureReport records the result.</text>

  <rect x="1178" y="842" width="317" height="192" rx="8" class="optional"/>
  <text x="1202" y="875" class="box-title">Optional LLM paths</text>
  <text x="1202" y="902" class="box-copy">ConfiguredLLM</text>
  <text x="1202" y="923" class="box-copy">entity extraction</text>
  <text x="1202" y="944" class="box-copy">generated summaries</text>
  <text x="1202" y="965" class="box-copy">orphan-link suggestions</text>
  <text x="1202" y="1005" class="label">Deterministic fallback remains available.</text>

  <!-- Footer legend -->
  <line x1="74" y1="1060" x2="1513" y2="1060" class="thin"/>
  <text x="74" y="1081" class="label mono">implemented now</text>
  <rect x="178" y="1070" width="14" height="14" rx="2" class="high"/>
  <text x="214" y="1081" class="label mono">storage / process</text>
  <rect x="335" y="1070" width="14" height="14" rx="2" class="data"/>
  <text x="371" y="1081" class="label mono">accountability / deletion</text>
  <rect x="534" y="1070" width="14" height="14" rx="2" class="risk"/>
  <text x="575" y="1081" class="label mono">optional provider</text>
  <rect x="710" y="1070" width="14" height="14" rx="2" class="optional"/>
  <text x="1290" y="1081" class="label mono">v1.0 · architecture board · source: implemented repository modules</text>
</svg>
