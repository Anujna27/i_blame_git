<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1587 1123" role="img" aria-labelledby="title desc">
  <title id="title">MNEMOSYNE implemented architecture at high, mid, and low levels</title>
  <desc id="desc">A3 landscape architecture sheet showing agent harnesses, MemoryNode identity, hybrid memory, accountable erasure, retrieval, handoff, and the implemented storage records.</desc>

  <style>
    /* Hallmark v2.0.0 | custom architecture sheet | A3 landscape */
    /* Critique: make the MemoryNode UUID the visible spine across every implemented projection. */
    :root {
      --paper: #edf2f0;
      --paper-soft: #f8fbfa;
      --ink: #102b31;
      --muted: #5d7378;
      --line: #c7d7d4;
      --line-strong: #98b4b1;
      --teal: #1b7775;
      --teal-soft: #d7ece8;
      --coral: #e7664f;
      --coral-soft: #f7ddd7;
      --amber: #c38b2f;
      --amber-soft: #f5e7bd;
      --cyan: #2d6f8d;
      --cyan-soft: #dcebf1;
      --deep: #163e48;
      --white: #ffffff;
      --font-display: "Aptos Display", "Segoe UI", Arial, sans-serif;
      --font-sans: "Aptos", "Segoe UI", Arial, sans-serif;
      --font-mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    text { font-family: var(--font-sans); fill: var(--ink); }
    .mono { font-family: var(--font-mono); }
    .meta { font-size: 12px; fill: var(--muted); }
    .title { font-family: var(--font-display); font-size: 39px; font-weight: 700; letter-spacing: -1.5px; fill: var(--deep); }
    .subtitle { font-size: 16px; fill: var(--muted); }
    .tier { font-size: 13px; font-weight: 700; fill: var(--coral); }
    .section { font-family: var(--font-display); font-size: 20px; font-weight: 700; fill: var(--deep); }
    .panel-title { font-size: 17px; font-weight: 700; fill: var(--deep); }
    .body { font-size: 13px; fill: var(--ink); }
    .body-muted { font-size: 12px; fill: var(--muted); }
    .small-mono { font-family: var(--font-mono); font-size: 11px; fill: var(--muted); }
    .tag-text { font-size: 11px; font-weight: 700; fill: var(--deep); }
    .step-number { font-size: 12px; font-weight: 700; fill: var(--white); }
    .paper { fill: var(--paper); }
    .paper-soft { fill: var(--paper-soft); }
    .frame { fill: none; stroke: var(--deep); stroke-width: 2; }
    .hairline { fill: none; stroke: var(--line); stroke-width: 1; }
    .rule { fill: none; stroke: var(--line-strong); stroke-width: 1.3; }
    .high-panel { fill: var(--cyan-soft); stroke: var(--cyan); stroke-width: 1.4; }
    .identity-panel { fill: var(--teal-soft); stroke: var(--teal); stroke-width: 1.4; }
    .store-panel { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.4; }
    .account-panel { fill: var(--coral-soft); stroke: var(--coral); stroke-width: 1.4; }
    .neutral-panel { fill: var(--paper-soft); stroke: var(--line-strong); stroke-width: 1.2; }
    .optional-panel { fill: var(--paper-soft); stroke: var(--teal); stroke-width: 1.4; stroke-dasharray: 7 5; }
    .spine { fill: none; stroke: var(--deep); stroke-width: 2; }
    .teal-flow { fill: none; stroke: var(--teal); stroke-width: 1.8; marker-end: url(#arrow-teal); }
    .deep-flow { fill: none; stroke: var(--deep); stroke-width: 1.8; marker-end: url(#arrow-deep); }
    .coral-flow { fill: none; stroke: var(--coral); stroke-width: 1.8; marker-end: url(#arrow-coral); }
    .optional-flow { fill: none; stroke: var(--teal); stroke-width: 1.6; stroke-dasharray: 7 5; marker-end: url(#arrow-teal); }
    .pill-teal { fill: var(--teal); }
    .pill-coral { fill: var(--coral); }
    .pill-amber { fill: var(--amber); }
    .pill-cyan { fill: var(--cyan); }
    .pill-white { fill: var(--white); stroke: var(--line); stroke-width: 1; }
    .number-teal { fill: var(--teal); }
    .number-coral { fill: var(--coral); }
    .number-amber { fill: var(--amber); }
    .arrow-teal { fill: var(--teal); }
    .arrow-deep { fill: var(--deep); }
    .arrow-coral { fill: var(--coral); }
  </style>

  <defs>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" class="arrow-teal"/>
    </marker>
    <marker id="arrow-deep" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" class="arrow-deep"/>
    </marker>
    <marker id="arrow-coral" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" class="arrow-coral"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 H0 V28" class="hairline" opacity=".42"/>
    </pattern>
  </defs>

  <rect width="1587" height="1123" class="paper"/>
  <rect x="34" y="34" width="1519" height="1055" fill="url(#grid)" opacity=".18"/>
  <rect x="34" y="34" width="1519" height="1055" class="frame"/>

  <!-- Header -->
  <text x="67" y="75" class="meta mono">MNEMOSYNE / implemented architecture / A3 landscape</text>
  <text x="67" y="126" class="title">One identity. Four projections. One accountable lifecycle.</text>
  <text x="69" y="155" class="subtitle">The implemented path from agent harness to durable memory, context transfer, and evidence-backed erasure.</text>

  <rect x="1245" y="61" width="250" height="95" rx="8" class="neutral-panel"/>
  <text x="1265" y="88" class="meta">Sheet status</text>
  <text x="1265" y="116" class="panel-title">Implemented core</text>
  <text x="1265" y="139" class="body-muted">Dashed paths are optional providers.</text>

  <!-- High level -->
  <line x1="67" y1="188" x2="1495" y2="188" class="rule"/>
  <text x="67" y="216" class="tier">01 / High level</text>
  <text x="222" y="216" class="section">System boundary and ownership</text>

  <rect x="67" y="239" width="305" height="117" rx="9" class="high-panel"/>
  <text x="89" y="271" class="panel-title">Harnesses</text>
  <text x="89" y="297" class="body">AgentA owns live memory work.</text>
  <text x="89" y="318" class="body">AgentB receives portable capsules.</text>
  <rect x="89" y="331" width="131" height="19" rx="9" class="pill-white"/>
  <text x="103" y="344" class="tag-text">remember · recall · forget</text>

  <rect x="404" y="239" width="305" height="117" rx="9" class="identity-panel"/>
  <text x="426" y="271" class="panel-title">Memory identity</text>
  <text x="426" y="297" class="body">MemoryNode carries the UUID, session,</text>
  <text x="426" y="318" class="body">trust, summaries, properties, and lifecycle.</text>
  <rect x="426" y="331" width="146" height="19" rx="9" class="pill-white"/>
  <text x="440" y="344" class="tag-text">entity first</text>

  <rect x="741" y="239" width="350" height="117" rx="9" class="store-panel"/>
  <text x="763" y="271" class="panel-title">Hybrid memory</text>
  <text x="763" y="297" class="body">KnowledgeGraph and FAISS support recall.</text>
  <text x="763" y="318" class="body">FilesystemMemory keeps inspectable records.</text>
  <rect x="763" y="331" width="127" height="19" rx="9" class="pill-white"/>
  <text x="777" y="344" class="tag-text">graph plus vector</text>

  <rect x="1123" y="239" width="372" height="117" rx="9" class="account-panel"/>
  <text x="1145" y="271" class="panel-title">Accountability</text>
  <text x="1145" y="297" class="body">ErasureEngine, HashChain, journaled recovery,</text>
  <text x="1145" y="318" class="body">risk reporting, and graph healing surround memory.</text>
  <rect x="1145" y="331" width="135" height="19" rx="9" class="pill-white"/>
  <text x="1159" y="344" class="tag-text">auditable flow</text>

  <path d="M372 298 H404" class="deep-flow"/>
  <path d="M709 298 H741" class="deep-flow"/>
  <path d="M1091 298 H1123" class="deep-flow"/>

  <line x1="67" y1="381" x2="1495" y2="381" class="hairline"/>
  <text x="67" y="403" class="body-muted">The same MemoryNode UUID is the join key across graph, vector, filesystem, session, capsule, and audit records.</text>
  <text x="1154" y="403" class="small-mono">one identity boundary</text>

  <!-- Mid level -->
  <line x1="67" y1="428" x2="1495" y2="428" class="rule"/>
  <text x="67" y="456" class="tier">02 / Mid level</text>
  <text x="222" y="456" class="section">The working flows</text>

  <!-- Write flow -->
  <rect x="67" y="479" width="466" height="250" rx="9" class="neutral-panel"/>
  <text x="91" y="513" class="panel-title">Write and consolidate</text>
  <circle cx="101" cy="550" r="14" class="number-teal"/><text x="97" y="555" class="step-number">1</text>
  <text x="128" y="555" class="body">AgentA.remember creates a MemoryNode.</text>
  <circle cx="101" cy="589" r="14" class="number-teal"/><text x="97" y="594" class="step-number">2</text>
  <text x="128" y="594" class="body">VectorStore and KnowledgeGraph receive it.</text>
  <circle cx="101" cy="628" r="14" class="number-teal"/><text x="97" y="633" class="step-number">3</text>
  <text x="128" y="633" class="body">SessionStore and HashChain record the write.</text>
  <circle cx="101" cy="667" r="14" class="number-teal"/><text x="97" y="672" class="step-number">4</text>
  <text x="128" y="672" class="body">commit_session writes filesystem memory.</text>
  <path d="M101 564 V575 M101 603 V614 M101 642 V653" class="teal-flow"/>
  <text x="91" y="704" class="small-mono">commit also invokes graph healing</text>

  <!-- Read and handoff -->
  <rect x="560" y="479" width="466" height="250" rx="9" class="neutral-panel"/>
  <text x="584" y="513" class="panel-title">Read and hand off context</text>
  <rect x="584" y="535" width="187" height="44" rx="7" class="high-panel"/>
  <text x="604" y="562" class="tag-text">VectorStore.query</text>
  <rect x="815" y="535" width="187" height="44" rx="7" class="identity-panel"/>
  <text x="842" y="562" class="tag-text">graph expansion</text>
  <path d="M771 557 H815" class="deep-flow"/>
  <rect x="699" y="607" width="212" height="44" rx="7" class="store-panel"/>
  <text x="725" y="634" class="tag-text">ContextBuilder → ActiveContext</text>
  <path d="M678 579 V592 H805 V607" class="teal-flow"/>
  <path d="M909 579 V592 H805 V607" class="teal-flow"/>
  <text x="584" y="679" class="body-muted">Token budget, abstention, and contradiction checks gate what reaches the harness.</text>
  <path d="M805 651 V669" class="deep-flow"/>
  <text x="584" y="704" class="small-mono">CapsuleExporter → capsule JSON → CapsuleImporter → AgentB</text>

  <!-- Erasure flow -->
  <rect x="1053" y="479" width="442" height="250" rx="9" class="neutral-panel"/>
  <text x="1077" y="513" class="panel-title">Delete and recover</text>
  <rect x="1077" y="535" width="178" height="44" rx="7" class="account-panel"/>
  <text x="1105" y="562" class="tag-text">AgentA.forget</text>
  <rect x="1290" y="535" width="181" height="44" rx="7" class="store-panel"/>
  <text x="1307" y="562" class="tag-text">scoped manifest</text>
  <path d="M1255 557 H1290" class="coral-flow"/>
  <rect x="1170" y="607" width="212" height="44" rx="7" class="account-panel"/>
  <text x="1190" y="634" class="tag-text">scrub every projection</text>
  <path d="M1166 579 V592 H1276 V607" class="coral-flow"/>
  <path d="M1381 579 V592 H1276 V607" class="coral-flow"/>
  <text x="1077" y="679" class="body-muted">Graph, vectors, filesystem, sessions, blocked IDs, and audit are checked.</text>
  <text x="1077" y="704" class="small-mono">ErasureJournal → ErasureRecovery on interruption</text>

  <!-- Low level -->
  <line x1="67" y1="762" x2="1495" y2="762" class="rule"/>
  <text x="67" y="790" class="tier">03 / Low level</text>
  <text x="222" y="790" class="section">Records, interfaces, and persistence</text>

  <rect x="67" y="813" width="344" height="213" rx="9" class="identity-panel"/>
  <text x="91" y="846" class="panel-title">MemoryNode record</text>
  <text x="91" y="876" class="small-mono">node_id · session_id · entity_type</text>
  <text x="91" y="898" class="small-mono">content · properties · trust_status</text>
  <text x="91" y="920" class="small-mono">summary_l0 · summary_l1 · content_l2</text>
  <text x="91" y="942" class="small-mono">lifecycle · deletion_state · edges</text>
  <line x1="91" y1="963" x2="387" y2="963" class="hairline"/>
  <text x="91" y="989" class="body-muted">UUID binds every representation.</text>

  <rect x="432" y="813" width="344" height="213" rx="9" class="store-panel"/>
  <text x="456" y="846" class="panel-title">Durable projections</text>
  <text x="456" y="876" class="small-mono">knowledge_graph.json</text>
  <text x="456" y="898" class="small-mono">FAISS index and metadata JSON</text>
  <text x="456" y="920" class="small-mono">sessions.json</text>
  <text x="456" y="942" class="small-mono">viking_memory/.../entity.json</text>
  <text x="456" y="964" class="small-mono">audit_log · erasure_journal</text>
  <text x="456" y="989" class="body-muted">Capsules package portable state.</text>

  <rect x="797" y="813" width="344" height="213" rx="9" class="account-panel"/>
  <text x="821" y="846" class="panel-title">Accountability contract</text>
  <text x="821" y="876" class="body">Source removal</text>
  <text x="821" y="898" class="body">Derived invalidation</text>
  <text x="821" y="920" class="body">Inference blocking</text>
  <text x="821" y="942" class="body">Non-inferability checks</text>
  <text x="821" y="964" class="body">State restoration checks</text>
  <text x="821" y="989" class="body-muted">ErasureReport records actor, reason, time, and result.</text>

  <rect x="1162" y="813" width="333" height="213" rx="9" class="optional-panel"/>
  <text x="1186" y="846" class="panel-title">Provider and policy paths</text>
  <text x="1186" y="876" class="body">ConfiguredLLM: Groq or Ollama</text>
  <text x="1186" y="898" class="body">EntityExtractor and SummaryGenerator</text>
  <text x="1186" y="920" class="body">HonchoDreaming with Laya gate</text>
  <text x="1186" y="942" class="body">GraphHealer link suggestions</text>
  <text x="1186" y="964" class="body">Deterministic fallbacks remain active</text>
  <text x="1186" y="989" class="body-muted">Optional means disabled by default, not absent.</text>

  <!-- Footer -->
  <line x1="67" y1="1051" x2="1495" y2="1051" class="hairline"/>
  <rect x="67" y="1065" width="13" height="13" rx="2" class="pill-cyan"/>
  <text x="89" y="1076" class="meta">harness and context</text>
  <rect x="237" y="1065" width="13" height="13" rx="2" class="pill-teal"/>
  <text x="259" y="1076" class="meta">identity and graph</text>
  <rect x="407" y="1065" width="13" height="13" rx="2" class="pill-amber"/>
  <text x="429" y="1076" class="meta">storage and retrieval</text>
  <rect x="602" y="1065" width="13" height="13" rx="2" class="pill-coral"/>
  <text x="624" y="1076" class="meta">accountability and erasure</text>
  <rect x="830" y="1065" width="13" height="13" rx="2" class="optional-panel"/>
  <text x="852" y="1076" class="meta">optional provider path</text>
  <text x="1160" y="1076" class="small-mono">source: implemented repository modules</text>
</svg>
